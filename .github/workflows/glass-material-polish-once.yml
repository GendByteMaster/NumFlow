name: One-shot NumFlow glass material polish

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/glass-material-polish-once.yml
      - scripts/apply_glass_material_polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Fix Slint switch accessibility role
        shell: pwsh
        run: |
          $path = 'scripts/apply_glass_material_polish.py'
          $content = Get-Content $path -Raw
          $content = $content.Replace('accessible-role: check-box;', 'accessible-role: switch;')
          Set-Content $path $content -NoNewline

      - name: Apply glass material polish
        run: python scripts/apply_glass_material_polish.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Verify visual guardrails
        shell: pwsh
        run: |
          if (-not (Select-String -Path src/app.rs -Pattern 'BackdropType::MainWindow' -Quiet)) { throw 'Main window Mica backdrop missing' }
          if (-not (Select-String -Path src/hud.rs -Pattern 'BackdropType::TransientWindow' -Quiet)) { throw 'HUD Acrylic backdrop missing' }
          if (-not (Select-String -Path ui/hud.slint -Pattern 'revealed' -Quiet)) { throw 'HUD reveal animation missing' }
          if (-not (Select-String -Path ui/design-system.slint -Pattern 'GlassToggle' -Quiet)) { throw 'Glass toggle missing' }
          if (Select-String -Path ui/*.slint -Pattern 'animation-tick\(\)|iteration-count' -Quiet) { throw 'Looping animation detected' }
          if (Select-String -Path ui/app.slint -Pattern 'text: "NumPad"' -Quiet) { throw 'NumPad section returned to main UI' }

      - name: Commit validated glass polish
        shell: pwsh
        run: |
          Remove-Item scripts/apply_glass_material_polish.py
          Remove-Item .github/workflows/glass-material-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): add glass material polish"
          git push origin HEAD:dev/master
