name: One-shot quieter NumFlow UI SFX

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/quiet-ui-sfx-more-once.yml

permissions:
  contents: write

jobs:
  quiet:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Lower UI SFX by another 4 dB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import math
          import struct
          import wave
          from pathlib import Path

          gain = 10 ** (-4.0 / 20.0)
          root = Path("assets/sfx/glass")
          files = sorted(root.glob("*.wav"))
          if not files:
              raise SystemExit("No UI SFX WAV files found")

          for path in files:
              with wave.open(str(path), "rb") as src:
                  params = src.getparams()
                  if params.sampwidth != 2:
                      raise SystemExit(f"Expected 16-bit PCM WAV: {path}")
                  frames = src.readframes(params.nframes)

              samples = list(struct.unpack(f"<{len(frames) // 2}h", frames))
              before_peak = max((abs(sample) for sample in samples), default=0)
              scaled = [max(-32768, min(32767, round(sample * gain))) for sample in samples]
              after_peak = max((abs(sample) for sample in scaled), default=0)

              if before_peak and not (0.61 <= after_peak / before_peak <= 0.65):
                  raise SystemExit(
                      f"Unexpected gain ratio for {path}: {after_peak / before_peak:.4f}"
                  )

              encoded = struct.pack(f"<{len(scaled)}h", *scaled)
              with wave.open(str(path), "wb") as dst:
                  dst.setparams(params)
                  dst.writeframes(encoded)

              print(f"{path.name}: peak {before_peak} -> {after_peak}")
          '@ | python -

      - name: Verify WAV assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem assets/sfx/glass/*.wav
          if ($files.Count -eq 0) { throw 'No UI SFX WAV files found' }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 44) { throw "Invalid WAV: $($file.Name)" }
            if ([Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'RIFF') { throw "Missing RIFF header: $($file.Name)" }
            if ([Text.Encoding]::ASCII.GetString($bytes, 8, 4) -ne 'WAVE') { throw "Missing WAVE header: $($file.Name)" }
          }

      - name: Commit quieter assets
        shell: pwsh
        run: |
          Remove-Item .github/workflows/quiet-ui-sfx-more-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audio): lower UI sounds to subtle level"
          git push origin HEAD:dev/master
