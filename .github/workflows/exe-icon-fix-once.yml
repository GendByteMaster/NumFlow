name: One-shot NumFlow executable icon

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/exe-icon-fix-once.yml
      - scripts/_exe_icon_fix.py

permissions:
  contents: write

jobs:
  embed:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply executable icon build pipeline
        run: python scripts/_exe_icon_fix.py

      - name: Update lockfile
        run: cargo check --workspace --all-features

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Verify PE icon resource
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class NumFlowIconProbe
          {
              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              public static extern uint ExtractIconEx(
                  string szFileName,
                  int nIconIndex,
                  IntPtr[] phiconLarge,
                  IntPtr[] phiconSmall,
                  uint nIcons);
          }
          "@

          $exe = (Resolve-Path "target/release/numflow.exe").Path
          $iconCount = [NumFlowIconProbe]::ExtractIconEx($exe, -1, $null, $null, 0)
          if ($iconCount -lt 1) {
              throw "target/release/numflow.exe does not contain an executable icon resource"
          }
          Write-Host "Verified $iconCount executable icon resource(s) in $exe"

      - name: Commit validated executable icon support
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock build.rs
          git rm .github/workflows/exe-icon-fix-once.yml scripts/_exe_icon_fix.py
          git commit -m "fix(build): embed NumFlow logo in Windows executable"
          git push origin HEAD:dev/master
