name: One-shot NumFlow compact UI accessibility

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/compact-ui-accessibility-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply accessibility polish
        run: python scripts/apply_compact_ui_accessibility.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated accessibility polish
        shell: pwsh
        run: |
          Remove-Item scripts/apply_compact_ui_accessibility.py
          Remove-Item .github/workflows/compact-ui-accessibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ui): polish compact utility accessibility"
          git push origin HEAD:dev/master
