name: One-shot NumFlow Windows distribution

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/windows-distribution-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply installer, background startup, workflows, and docs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # --background is a launch-mode override, not a persisted user preference.
          replace_once(
              "src/main.rs",
              "    if let Err(error) = app::run() {",
              "    let background = std::env::args_os()\n"
              "        .skip(1)\n"
              "        .any(|argument| argument == std::ffi::OsStr::new(\"--background\"));\n\n"
              "    if let Err(error) = app::run(background) {",
          )
          replace_once(
              "src/app.rs",
              "pub fn run() -> Result<(), AppError> {",
              "pub fn run(background: bool) -> Result<(), AppError> {",
          )
          replace_once(
              "src/app.rs",
              "    if settings.borrow().start_minimized() {\n"
              "        tracing::info!(\"starting NumFlow with settings window hidden\");",
              "    if background || settings.borrow().start_minimized() {\n"
              "        tracing::info!(\n"
              "            background,\n"
              "            start_minimized = settings.borrow().start_minimized(),\n"
              "            \"starting NumFlow with settings window hidden\"\n"
              "        );",
          )

          # Autostart now always uses the explicit background launch mode.
          replace_once(
              "crates/numflow-windows/src/startup.rs",
              "    command.push(u16::from(b'\\\"'));\n    command.push(0);",
              "    command.push(u16::from(b'\\\"'));\n"
              "    command.extend(\" --background\".encode_utf16());\n"
              "    command.push(0);",
          )
          replace_once(
              "crates/numflow-windows/src/startup.rs",
              "        assert_eq!(decoded, r#\"\\\"C:\\\\Program Files\\\\NumFlow\\\\numflow.exe\\\"\"#);",
              "        assert_eq!(\n"
              "            decoded,\n"
              "            r#\"\\\"C:\\\\Program Files\\\\NumFlow\\\\numflow.exe\\\" --background\"#\n"
              "        );",
          )

          # CI must also protect release PRs targeting master.
          replace_once(
              ".github/workflows/ci.yml",
              "  pull_request:\n    branches:\n      - dev/master",
              "  pull_request:\n    branches:\n      - dev/master\n      - master",
          )

          Path("installer").mkdir(exist_ok=True)
          Path("installer/NumFlow.wxs").write_text(r'''<?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package
              Name="NumFlow"
              Manufacturer="GendByteMaster"
              Version="$(ProductVersion)"
              Language="1033"
              UpgradeCode="{7F9CE574-3373-4A83-9AFD-1FE468493DE0}"
              Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
              <MediaTemplate EmbedCab="yes" />

              <StandardDirectory Id="ProgramFiles6432Folder">
                <Directory Id="INSTALLFOLDER" Name="NumFlow">
                  <Component Id="NumFlowExecutable" Guid="*">
                    <File Id="NumFlowExe" Source="$(NumFlowExe)" KeyPath="yes">
                      <Shortcut
                        Id="NumFlowStartMenuShortcut"
                        Directory="ProgramMenuFolder"
                        Name="NumFlow"
                        Description="Precise pointer control from your keyboard"
                        WorkingDirectory="INSTALLFOLDER" />
                    </File>
                  </Component>
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder" />

              <Feature Id="MainFeature" Title="NumFlow" Level="1">
                <ComponentRef Id="NumFlowExecutable" />
              </Feature>
            </Package>
          </Wix>
          '''.replace("          ", ""), encoding="utf-8")

          release_workflow = '''name: Windows Release

          on:
            pull_request:
              branches:
                - master
            push:
              tags:
                - "v*"
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: release-{REF}
            cancel-in-progress: false

          jobs:
            windows-distribution:
              name: Build Windows MSI and portable package
              runs-on: windows-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Install Rust
                  uses: dtolnay/rust-toolchain@1.98.0
                  with:
                    components: rustfmt, clippy

                - name: Cache Rust build
                  uses: Swatinem/rust-cache@v2

                - name: Formatting
                  run: cargo fmt --all -- --check

                - name: Clippy
                  run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

                - name: Tests
                  run: cargo test --locked --workspace --all-features

                - name: Release build
                  run: cargo build --locked --workspace --release --all-features

                - name: Install WiX Toolset 4
                  shell: pwsh
                  run: |
                    dotnet tool install --global wix --version 4.0.6
                    "$env:USERPROFILE\\.dotnet\\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

                - name: Resolve release version
                  shell: pwsh
                  run: |
                    $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
                    $package = $metadata.packages | Where-Object { $_.name -eq "numflow" } | Select-Object -First 1
                    if ($null -eq $package) { throw "numflow package metadata not found" }
                    "NUMFLOW_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                    if ($env:GITHUB_REF -like "refs/tags/*") {
                      $expected = "refs/tags/v$($package.version)"
                      if ($env:GITHUB_REF -ne $expected) {
                        throw "Release tag $env:GITHUB_REF does not match Cargo version $expected"
                      }
                    }

                - name: Build MSI and portable ZIP
                  shell: pwsh
                  run: |
                    $ErrorActionPreference = "Stop"
                    New-Item -ItemType Directory -Force dist | Out-Null
                    $exe = (Resolve-Path "target/release/numflow.exe").Path
                    $msi = "dist/NumFlow-$env:NUMFLOW_VERSION-x64.msi"
                    wix build installer/NumFlow.wxs -arch x64 -d "ProductVersion=$env:NUMFLOW_VERSION" -d "NumFlowExe=$exe" -pdbtype none -out $msi
                    if (-not (Test-Path $msi) -or (Get-Item $msi).Length -le 0) { throw "MSI was not produced" }

                    $portable = "dist/NumFlow-$env:NUMFLOW_VERSION-portable"
                    New-Item -ItemType Directory -Force $portable | Out-Null
                    Copy-Item $exe "$portable/NumFlow.exe"
                    Copy-Item LICENSE "$portable/LICENSE"
                    Copy-Item README.md "$portable/README.md"
                    Copy-Item assets/sfx/README.md "$portable/SFX-LICENSE.md"
                    Compress-Archive -Path "$portable/*" -DestinationPath "dist/NumFlow-$env:NUMFLOW_VERSION-portable-x64.zip" -CompressionLevel Optimal
                    Remove-Item -Recurse -Force $portable

                - name: Verify distribution artifacts
                  shell: pwsh
                  run: |
                    $ErrorActionPreference = "Stop"
                    $msi = "dist/NumFlow-$env:NUMFLOW_VERSION-x64.msi"
                    $zip = "dist/NumFlow-$env:NUMFLOW_VERSION-portable-x64.zip"
                    wix msi decompile $msi -out "dist/NumFlow-$env:NUMFLOW_VERSION-decompiled.wxs"
                    if (-not (Test-Path "dist/NumFlow-$env:NUMFLOW_VERSION-decompiled.wxs")) { throw "MSI decompile verification failed" }

                    $verify = Join-Path $env:RUNNER_TEMP "numflow-portable-verify"
                    Expand-Archive $zip -DestinationPath $verify -Force
                    foreach ($required in @("NumFlow.exe", "LICENSE", "README.md", "SFX-LICENSE.md")) {
                      if (-not (Test-Path (Join-Path $verify $required))) { throw "Portable package missing $required" }
                    }
                    Remove-Item -Recurse -Force $verify
                    Remove-Item "dist/NumFlow-$env:NUMFLOW_VERSION-decompiled.wxs"

                - name: Generate SHA-256 checksums
                  shell: pwsh
                  run: |
                    $files = @(
                      "dist/NumFlow-$env:NUMFLOW_VERSION-x64.msi",
                      "dist/NumFlow-$env:NUMFLOW_VERSION-portable-x64.zip"
                    )
                    $lines = foreach ($file in $files) {
                      $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
                      "$hash  $([IO.Path]::GetFileName($file))"
                    }
                    $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt

                - name: Upload distribution artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: numflow-windows-x64
                    path: |
                      dist/*.msi
                      dist/*.zip
                      dist/SHA256SUMS.txt
                    if-no-files-found: error

                - name: Publish GitHub Release
                  if: startsWith(github.ref, 'refs/tags/v')
                  shell: pwsh
                  env:
                    GH_TOKEN: {TOKEN}
                  run: |
                    $tag = $env:GITHUB_REF_NAME
                    $files = @(
                      "dist/NumFlow-$env:NUMFLOW_VERSION-x64.msi",
                      "dist/NumFlow-$env:NUMFLOW_VERSION-portable-x64.zip",
                      "dist/SHA256SUMS.txt"
                    )
                    gh release view $tag *> $null
                    if ($LASTEXITCODE -eq 0) {
                      gh release upload $tag @files --clobber
                    } else {
                      gh release create $tag @files --title "NumFlow $tag" --generate-notes --verify-tag
                    }
          '''
          release_workflow = release_workflow.replace("          ", "")
          release_workflow = release_workflow.replace("{REF}", "$" + "{{ github.ref }}")
          release_workflow = release_workflow.replace("{TOKEN}", "$" + "{{ github.token }}")
          Path(".github/workflows/release.yml").write_text(release_workflow, encoding="utf-8")

          Path("docs/INSTALLATION.md").write_text(r'''# Installing NumFlow on Windows

          NumFlow is distributed in two Windows x64 formats:

          - `NumFlow-<version>-x64.msi` — recommended installed build.
          - `NumFlow-<version>-portable-x64.zip` — portable build that does not modify the installed-app list.

          ## MSI installation

          The MSI installs NumFlow per-machine to:

          ```text
          C:\Program Files\NumFlow\NumFlow.exe
          ```

          Because the package installs under Program Files, Windows may request administrator approval during installation. The installer also creates a Start Menu shortcut and registers NumFlow in Windows Installed Apps so it can be removed through normal Windows settings.

          User configuration is not stored beside the executable. It remains under the current user's application-data directory:

          ```text
          %APPDATA%\NumFlow\config.toml
          ```

          Updating or reinstalling the application therefore does not require moving the user's profiles, bindings, HUD preference, sound preference, or pointer settings.

          ## Portable build

          Extract the portable ZIP to a stable folder and run `NumFlow.exe` directly. The ZIP includes the executable, project license, README, and the UI SFX license/source notice.

          If `Start with Windows` is enabled while using the portable build, do not move or delete the executable afterward without first disabling that setting. The Windows startup registration points to the executable path that was current when the preference was applied.

          ## Start with Windows

          NumFlow's autostart setting is controlled by NumFlow itself, not forced by the MSI installer.

          When enabled, NumFlow writes the current executable to the current-user Windows Run key:

          ```text
          HKCU\Software\Microsoft\Windows\CurrentVersion\Run\NumFlow
          ```

          The registered command uses:

          ```text
          "C:\...\NumFlow.exe" --background
          ```

          `--background` starts the global keyboard runtime, tray icon, HUD support, and saved configuration without opening the settings window. This is independent of the normal `Start minimized` preference and does not require administrator rights because the startup registration is per-user.

          Turning `Start with Windows` off removes the Run entry. Resetting all NumFlow settings also attempts to remove the startup registration.

          ## Manual background launch

          The same startup mode can be used manually:

          ```powershell
          .\NumFlow.exe --background
          ```

          If NumFlow is already running, single-instance protection causes the second process to exit.

          ## Uninstall

          Remove the installed build from Windows **Settings → Apps → Installed apps → NumFlow** or with standard MSI tooling.

          User configuration is intentionally separate from the installation directory. Uninstalling the MSI does not treat user preferences as installer-owned application files. If `Start with Windows` is enabled, disable it in NumFlow before uninstalling so the current-user Run entry is removed cleanly.

          ## Integrity verification

          Tagged GitHub releases include `SHA256SUMS.txt`. Compare the SHA-256 hash of the downloaded MSI or portable ZIP with the matching entry before distribution when integrity verification is required.
          '''.replace("          ", ""), encoding="utf-8")

          Path("docs/RELEASING.md").write_text(r'''# NumFlow Windows release process

          NumFlow's Windows distribution pipeline is defined in `.github/workflows/release.yml` and is intentionally separate from the normal development CI gate.

          ## Outputs

          A validated build produces:

          - `NumFlow-<version>-x64.msi` — WiX Toolset 4 per-machine installer.
          - `NumFlow-<version>-portable-x64.zip` — portable archive.
          - `SHA256SUMS.txt` — SHA-256 checksums for both distribution artifacts.

          The portable archive contains `NumFlow.exe`, `LICENSE`, `README.md`, and `SFX-LICENSE.md`. Runtime assets such as the application icon and UI sounds are already embedded in the executable by the Rust build.

          ## Pull request validation

          Pull requests targeting `master` run both the standard Windows CI gate and the Windows distribution workflow. The distribution workflow performs formatting, Clippy, tests, a release build, WiX MSI creation, MSI decompilation verification, portable archive verification, and checksum generation.

          This makes the release PR itself the packaging validation point without publishing a public release.

          ## Creating a tagged release

          1. Ensure `Cargo.toml` contains the intended version.
          2. Ensure the release PR from `dev/master` to `master` is approved and merged only after the required manual release checklist is complete.
          3. Create and push a tag that exactly matches the Cargo package version, for example:

             ```powershell
             git tag v0.1.0
             git push origin v0.1.0
             ```

          4. The release workflow rejects a tag that does not equal `v<Cargo.toml version>`.
          5. For a valid tag it builds the MSI, portable ZIP, and checksums, uploads the workflow artifact, and creates or updates the matching GitHub Release.

          ## Local MSI build

          Requirements:

          - Rust 1.98 as pinned by the repository.
          - .NET 6 or newer.
          - WiX Toolset CLI 4.0.6.

          Example:

          ```powershell
          cargo build --locked --workspace --release --all-features
          dotnet tool install --global wix --version 4.0.6
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq "numflow" } |
            Select-Object -ExpandProperty version -First 1
          wix build installer/NumFlow.wxs -arch x64 `
            -d "ProductVersion=$version" `
            -d "NumFlowExe=$((Resolve-Path target/release/numflow.exe).Path)" `
            -pdbtype none `
            -out "NumFlow-$version-x64.msi"
          ```

          ## Signing

          The current pipeline builds reproducible unsigned artifacts. Production code signing should be added when a Windows code-signing certificate and protected CI secret strategy are available. Do not embed private signing material in the repository.
          '''.replace("          ", ""), encoding="utf-8")

          Path("CHANGELOG.md").write_text(r'''# Changelog

          All notable user-facing changes to NumFlow are tracked here.

          ## [Unreleased]

          ### Added

          - Compact Apple-inspired Slint settings interface with material/glass styling and accessible motion.
          - Separate editable Bindings panel instead of a permanent NumPad visualization in the main window.
          - HUD material styling and semantic UI SFX feedback.
          - Persistent 0–100% interface-sound volume control.
          - `--background` launch mode for silent startup into the system tray/runtime.
          - WiX Toolset 4 Windows x64 MSI packaging.
          - Portable Windows x64 ZIP packaging and SHA-256 release checksums.
          - GitHub Actions Windows distribution pipeline for release PRs and version tags.

          ### Changed

          - `Start with Windows` now registers NumFlow with the explicit `--background` launch mode.
          - Windows release packaging uses the embedded NumFlow executable icon generated from `assets/numflow-icon.svg`.

          ### Fixed

          - Foreground NumPad interception, HUD Alt+Tab/taskbar behavior, Num Lock/UI state synchronization, glass contrast, and UI sound attenuation.
          '''.replace("          ", ""), encoding="utf-8")

          # README: update stale UI/audio wording and document packaged installation.
          replace_once(
              "README.md",
              "- Main Slint settings window with live status and NumPad visualization.",
              "- Compact Slint settings window with material styling and a separate editable Bindings panel.",
          )
          replace_once(
              "README.md",
              "- start-with-Windows state;\n- profile speed / maximum speed / acceleration;",
              "- start-with-Windows state;\n- interface-sound enable state and 0–100% volume;\n- profile speed / maximum speed / acceleration;",
          )
          replace_once(
              "README.md",
              "The audio service already exposes an enable/disable control internally so a user-facing sound toggle can be added to Settings later without changing the Num Lock runtime architecture.",
              "Interface sounds can be enabled or disabled in Advanced settings, and their volume is persisted independently from the Windows system mixer.",
          )
          installation_section = r'''## Installation

          Windows x64 releases provide two artifacts:

          - **MSI:** `NumFlow-<version>-x64.msi` installs to `C:\Program Files\NumFlow`, creates a Start Menu shortcut, and appears in Windows Installed Apps.
          - **Portable:** `NumFlow-<version>-portable-x64.zip` can be extracted and run without installation.

          `Start with Windows` remains an explicit user preference. When enabled, NumFlow registers the current executable under the current-user Windows Run key with `--background`, so the global input runtime and tray start after sign-in without opening the settings window. The startup registration itself does not require administrator rights.

          See [`docs/INSTALLATION.md`](docs/INSTALLATION.md) for installation, portable usage, autostart, uninstall, and checksum details.

          '''.replace("          ", "")
          replace_once("README.md", "## Running from source\n", installation_section + "## Running from source\n")
          replace_once(
              "README.md",
              "- Windows executable icon/metadata and packaging strategy;\n- release artifact checksums, changelog, usage notes, and known limitations.",
              "- final executable metadata/code-signing policy;\n- clean-machine installer validation and remaining manual release evidence.",
          )
          replace_once(
              "README.md",
              "See [`docs/RELEASE_CHECKLIST.md`](docs/RELEASE_CHECKLIST.md) and the [v0.1 roadmap]",
              "See [`docs/INSTALLATION.md`](docs/INSTALLATION.md), [`docs/RELEASING.md`](docs/RELEASING.md), [`docs/RELEASE_CHECKLIST.md`](docs/RELEASE_CHECKLIST.md), and the [v0.1 roadmap]",
          )

          # Development docs get reproducible local packaging instructions without rewriting existing architecture notes.
          development = Path("docs/DEVELOPMENT.md")
          dev_text = development.read_text(encoding="utf-8")
          if "## Windows distribution development" not in dev_text:
              dev_text += r'''

          ## Windows distribution development

          Distribution changes must preserve the normal Rust quality gate and also prove that the MSI and portable archive can be built from the same release executable. WiX authoring lives in `installer/NumFlow.wxs`; release automation lives in `.github/workflows/release.yml`.

          The MSI is a per-machine x64 package for `Program Files`, while `Start with Windows` remains a per-user runtime preference implemented by `numflow-windows`. Autostart invokes the installed or portable executable with `--background`; do not move this responsibility into the installer or force startup on users.

          For local packaging commands and tag/version rules, see [`RELEASING.md`](RELEASING.md). For end-user behavior, see [`INSTALLATION.md`](INSTALLATION.md).
          '''.replace("          ", "")
              development.write_text(dev_text, encoding="utf-8")

          # Release checklist: mark only implementation/automation evidence complete; leave manual validation open.
          replace_once(
              "docs/RELEASE_CHECKLIST.md",
              "- settings layout remains usable;\n- no clipped labels/controls;\n- NumPad visualization remains readable;",
              "- settings layout remains usable;\n- no clipped labels/controls;\n- Bindings panel remains readable and reachable;",
          )
          replace_once(
              "docs/RELEASE_CHECKLIST.md",
              "- [ ] Start with Windows registration.\n- [ ] Single-instance behaviour.",
              "- [ ] Start with Windows registration uses `--background` and opens no settings window.\n- [ ] Single-instance behaviour.",
          )
          replace_once(
              "docs/RELEASE_CHECKLIST.md",
              "- [ ] Generate production Windows application icon resources from `assets/numflow-icon.svg`.\n- [ ] Add executable metadata.\n- [ ] Confirm release version.\n- [ ] Decide distribution format:\n  - [ ] portable archive, or\n  - [ ] traditional installer, or\n  - [ ] MSIX.\n- [ ] Produce clean release build from the approved commit.\n- [ ] Generate checksums for release artifacts.\n- [ ] Verify artifact on a clean Windows environment.\n- [ ] Finalize README usage instructions for packaged builds.\n- [ ] Publish known limitations.\n- [ ] Add/update changelog.\n- [ ] Verify license files are included where required.",
              "- [x] Generate production Windows application icon resources from `assets/numflow-icon.svg`.\n- [ ] Add/finalize executable metadata and production code signing.\n- [ ] Confirm release version.\n- [x] Distribution format selected: WiX Toolset 4 x64 MSI plus portable x64 ZIP.\n- [x] Release workflow produces a clean locked release build before packaging.\n- [x] Release workflow generates SHA-256 checksums for MSI and portable ZIP.\n- [ ] Verify installer and portable artifact on a clean Windows 10/11 environment.\n- [x] README and dedicated installation/releasing documentation describe packaged builds.\n- [x] Known UIPI and unsigned-build limitations are documented.\n- [x] `CHANGELOG.md` added/updated for the release candidate.\n- [x] Portable archive includes project and UI-SFX license/source notices.\n- [x] Release-PR workflow builds and verifies MSI structure plus portable ZIP contents.",
          )
          '@ | python -

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Install WiX Toolset 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate MSI authoring and portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'numflow' } | Select-Object -First 1).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'NumFlow version not found' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path 'target/release/numflow.exe').Path
          $msi = "dist/NumFlow-$version-x64.msi"
          wix build installer/NumFlow.wxs -arch x64 -d "ProductVersion=$version" -d "NumFlowExe=$exe" -pdbtype none -out $msi
          if (-not (Test-Path $msi) -or (Get-Item $msi).Length -le 0) { throw 'MSI was not produced' }
          wix msi decompile $msi -out dist/decompiled.wxs
          if (-not (Test-Path dist/decompiled.wxs)) { throw 'MSI decompile verification failed' }

          $portable = "dist/NumFlow-$version-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item $exe "$portable/NumFlow.exe"
          Copy-Item LICENSE "$portable/LICENSE"
          Copy-Item README.md "$portable/README.md"
          Copy-Item assets/sfx/README.md "$portable/SFX-LICENSE.md"
          $zip = "dist/NumFlow-$version-portable-x64.zip"
          Compress-Archive -Path "$portable/*" -DestinationPath $zip -CompressionLevel Optimal
          $verify = Join-Path $env:RUNNER_TEMP 'numflow-portable-verify'
          Expand-Archive $zip -DestinationPath $verify -Force
          foreach ($required in @('NumFlow.exe', 'LICENSE', 'README.md', 'SFX-LICENSE.md')) {
            if (-not (Test-Path (Join-Path $verify $required))) { throw "Portable package missing $required" }
          }

      - name: Verify background startup and release guardrails
        shell: pwsh
        run: |
          $startup = Get-Content crates/numflow-windows/src/startup.rs -Raw
          if ($startup -notmatch '--background') { throw 'Startup registration does not use --background' }
          $release = Get-Content .github/workflows/release.yml -Raw
          foreach ($needle in @('wix --version', 'wix build', 'portable-x64.zip', 'SHA256SUMS.txt', 'refs/tags/')) {
            if ($release -notmatch [regex]::Escape($needle)) { throw "Release workflow missing $needle" }
          }
          foreach ($path in @('docs/INSTALLATION.md', 'docs/RELEASING.md', 'CHANGELOG.md', 'installer/NumFlow.wxs')) {
            if (-not (Test-Path $path)) { throw "Missing $path" }
          }

      - name: Commit validated distribution support
        shell: pwsh
        run: |
          Remove-Item .github/workflows/windows-distribution-once.yml
          Remove-Item -Recurse -Force dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(release): add Windows installer and background startup"
          git push origin HEAD:dev/master
