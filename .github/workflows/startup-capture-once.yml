name: One-shot startup capture repair

on:
  push:
    branches: [dev/master]
    paths:
      - scripts/_startup_capture_patch.py
      - .github/workflows/startup-capture-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/master
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - name: Apply startup repair
        run: python scripts/_startup_capture_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Formatting check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-features
      - name: Release build
        run: cargo build --locked --workspace --release --all-features
      - name: Commit validated repair
        shell: pwsh
        run: |
          git rm -f scripts/_startup_capture_patch.py .github/workflows/startup-capture-once.yml
          git add src/main.rs src/app.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(startup): activate keyboard capture before UI'
          git push origin HEAD:dev/master
