name: One-shot runtime quality fix

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/runtime-quality-fix-once.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout dev/master
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Preserve non-Windows InputAction import
        shell: pwsh
        run: |
          $path = "src/runtime.rs"
          $text = Get-Content $path -Raw
          $old = 'use numflow_core::{Bindings, CoreEffect, InputAction, MotionConfig, MouseButton};'
          $new = "use numflow_core::{Bindings, CoreEffect, MotionConfig, MouseButton};`n#[cfg(not(windows))]`nuse numflow_core::InputAction;"
          if (-not $text.Contains($old)) {
            throw "Expected runtime import was not found"
          }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline

      - name: Apply machine-applicable Clippy fixes
        run: cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged

      - name: Fix remaining runtime lints
        shell: pwsh
        run: |
          $path = "src/runtime.rs"
          $text = Get-Content $path -Raw

          $replacements = @(
            @(
              'worker_main(config, command_receiver, event_sender, ready_sender);',
              'worker_main(config, &command_receiver, &event_sender, &ready_sender);'
            ),
            @(
              'command_receiver: Receiver<RuntimeCommand>,',
              'command_receiver: &Receiver<RuntimeCommand>,'
            ),
            @(
              'event_sender: Sender<RuntimeEvent>,',
              'event_sender: &Sender<RuntimeEvent>,'
            ),
            @(
              'ready_sender: mpsc::SyncSender<Result<(), String>>,',
              'ready_sender: &mpsc::SyncSender<Result<(), String>>,'
            ),
            @(
              'let Some(normalized) = normalizer.process(event, &machine.bindings) else {',
              'let Some(normalized_event) = normalizer.process(event, &machine.bindings) else {'
            ),
            @(
              'machine.handle_key_event(normalized)',
              'machine.handle_key_event(normalized_event)'
            ),
            @(
              'fail_safe(&mut machine, &hook, &mut normalizer, &event_sender, &error);',
              'fail_safe(&mut machine, &hook, &mut normalizer, event_sender, &error);'
            )
          )

          foreach ($replacement in $replacements) {
            $old = $replacement[0]
            $new = $replacement[1]
            if (-not $text.Contains($old)) {
              throw "Expected source fragment was not found: $old"
            }
            $text = $text.Replace($old, $new)
          }

          $text = $text.Replace("                            &event_sender,`r`n", "                            event_sender,`r`n")
          $text = $text.Replace("                    &event_sender,`r`n", "                    event_sender,`r`n")
          $text = $text.Replace("                            &event_sender,`n", "                            event_sender,`n")
          $text = $text.Replace("                    &event_sender,`n", "                    event_sender,`n")

          Set-Content -Path $path -Value $text -NoNewline

      - name: Format
        run: cargo fmt --all

      - name: Generate reproducible dependency lockfile
        run: cargo generate-lockfile

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Release build
        run: cargo build --workspace --release --all-features

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-quality-fix-once.yml
          git add src/runtime.rs Cargo.lock
          git commit -m "fix(runtime): resolve quality gate findings"
          git push origin HEAD:dev/master
