name: One-shot foreground input repair

on:
  push:
    branches:
      - dev/master
    paths:
      - scripts/_foreground_input_fix.py
      - .github/workflows/foreground-input-fix-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply foreground input repair
        shell: pwsh
        run: python scripts/_foreground_input_fix.py

      - name: Format
        shell: pwsh
        run: cargo fmt --all

      - name: Formatting check
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        shell: pwsh
        run: cargo test --locked --workspace --all-features

      - name: Release build
        shell: pwsh
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/_foreground_input_fix.py .github/workflows/foreground-input-fix-once.yml
          git add Cargo.lock crates/numflow-windows/Cargo.toml crates/numflow-windows/src/hook.rs crates/numflow-windows/src/lib.rs src/app.rs
          git commit -m "fix(input): keep NumPad control active in focused UI"
          git push origin HEAD:dev/master
