name: One-shot NumFlow material contrast fix

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/material-contrast-fix-once.yml
      - scripts/apply_material_contrast_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply material contrast fix
        run: python scripts/apply_material_contrast_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Verify material guardrails
        shell: pwsh
        run: |
          if (-not (Select-String -Path ui/design-system.slint -Pattern 'with-alpha\(0\.97\)' -Quiet)) { throw 'Main material is still too transparent' }
          if (-not (Select-String -Path ui/design-system.slint -Pattern 'hud-material' -Quiet)) { throw 'HUD material missing' }
          if (Select-String -Path src/hud.rs -Pattern 'TransientWindow' -Quiet) { throw 'Full-window HUD Acrylic still enabled' }
          if (-not (Select-String -Path src/app.rs -Pattern 'BackdropType::MainWindow' -Quiet)) { throw 'Main Mica backdrop was removed' }

      - name: Commit validated contrast fix
        shell: pwsh
        run: |
          Remove-Item scripts/apply_material_contrast_fix.py
          Remove-Item .github/workflows/material-contrast-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): improve glass material contrast"
          git push origin HEAD:dev/master
