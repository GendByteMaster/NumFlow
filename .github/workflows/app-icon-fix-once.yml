name: One-shot NumFlow app icon

on:
  push:
    branches:
      - dev/master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Set NumFlow window icon
        shell: python
        run: |
          from pathlib import Path

          path = Path("ui/app.slint")
          text = path.read_text(encoding="utf-8")
          old = 'export component AppWindow inherits Window {\n    title: "NumFlow";\n'
          new = 'export component AppWindow inherits Window {\n    title: "NumFlow";\n    icon: @image-url("../assets/numflow-icon.svg");\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one AppWindow title marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Check diff
        run: git diff --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated icon fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/app-icon-fix-once.yml
          git add ui/app.slint
          git commit -m "fix(ui): use NumFlow logo as window icon"
          git push origin HEAD:dev/master
