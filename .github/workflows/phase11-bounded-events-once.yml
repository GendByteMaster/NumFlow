name: One-shot Phase 11 bounded runtime events

on:
  push:
    branches:
      - dev/master
    paths:
      - scripts/_phase11_bounded_events_patch.py
      - .github/workflows/phase11-bounded-events-once.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout dev/master
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply bounded runtime event patch
        run: python scripts/_phase11_bounded_events_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated Phase 11 event fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase11-bounded-events-once.yml scripts/_phase11_bounded_events_patch.py
          git add src/runtime.rs src/app.rs
          if (git diff --cached --quiet) { throw "No validated source changes to commit" }
          git commit -m "perf(runtime): bound UI event queue"
          git push origin HEAD:dev/master
