name: One-shot Windows-style tray indicator

on:
  push:
    branches:
      - dev/master
    paths:
      - scripts/_tray_indicator_patch.py
      - .github/workflows/tray-indicator-once.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout dev/master
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply tray indicator patch
        run: python scripts/_tray_indicator_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated tray indicator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tray-indicator-once.yml scripts/_tray_indicator_patch.py
          git add src/app.rs ui/tray.slint assets/icons/numflow
          if (git diff --cached --quiet) { throw "No validated tray indicator changes to commit" }
          git commit -m "feat(tray): show mouse button state in system tray"
          git push origin HEAD:dev/master
