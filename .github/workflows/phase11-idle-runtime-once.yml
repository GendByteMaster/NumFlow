name: One-shot Phase 11 idle runtime

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/phase11-idle-runtime-once.yml
      - scripts/_phase11_idle_runtime_patch.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev/master
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Repair unique runtime import marker
        shell: pwsh
        run: |
          $path = "scripts/_phase11_idle_runtime_patch.py"
          $text = Get-Content $path -Raw
          $oldMarker = '"    use numflow_core::{",'
          $newMarker = '"    use numflow_core::{\n        ClickKind,",'
          $oldReplacement = '"    use crossbeam_channel::{Receiver, Sender, TrySendError};\n    use numflow_core::{",'
          $newReplacement = '"    use crossbeam_channel::{Receiver, Sender, TrySendError};\n    use numflow_core::{\n        ClickKind,",'
          if (-not $text.Contains($oldMarker) -or -not $text.Contains($oldReplacement)) {
            throw "Expected runtime import markers were not found in Phase 11 patch script"
          }
          $text = $text.Replace($oldMarker, $newMarker)
          $text = $text.Replace($oldReplacement, $newReplacement)
          Set-Content -Path $path -Value $text -NoNewline

      - name: Apply Phase 11 idle-runtime patch
        run: python scripts/_phase11_idle_runtime_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Resolve dependency lockfile
        run: cargo check --workspace --all-features

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated Phase 11 fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase11-idle-runtime-once.yml scripts/_phase11_idle_runtime_patch.py
          git add Cargo.toml Cargo.lock crates/numflow-windows/Cargo.toml crates/numflow-windows/src/hook.rs src/runtime.rs
          git commit -m "perf(runtime): sleep until input while idle"
          git push origin HEAD:dev/master
