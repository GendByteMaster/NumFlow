name: One-shot event-driven runtime bridge

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/event-bridge-fix-once.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout dev/master
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply event-driven bridge patch
        run: python scripts/_event_bridge_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/event-bridge-fix-once.yml scripts/_event_bridge_patch.py
          git add src/runtime.rs src/app.rs ui/app.slint
          git commit -m "perf(runtime): replace UI polling with event-driven wakeups"
          git push origin HEAD:dev/master
