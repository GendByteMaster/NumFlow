name: One-shot NumFlow sound volume slider v4

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/sound-volume-slider-v4-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply sound volume patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content .github/workflows/sound-volume-slider-v2-once.yml -Raw
          $startMarker = "@'"
          $endMarker = "'@ | python -"
          $start = $workflow.IndexOf($startMarker)
          if ($start -lt 0) { throw 'Python patch start marker not found' }
          $start += $startMarker.Length
          $end = $workflow.IndexOf($endMarker, $start)
          if ($end -lt 0) { throw 'Python patch end marker not found' }
          $python = $workflow.Substring($start, $end - $start)
          $lines = $python -split "`r?`n"
          $python = ($lines | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $python = $python.Replace('pub const fn with_sound_volume', 'pub fn with_sound_volume')
          $python | python -

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Verify sound volume guardrails
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Select-String -Path crates/numflow-windows/src/audio.rs -Pattern 'chunks_exact_mut\(2\)' -Quiet) { throw 'Clippy regression still present' }
          if (-not (Select-String -Path crates/numflow-windows/src/audio.rs -Pattern 'AtomicU8' -Quiet)) { throw 'Atomic runtime volume missing' }
          if (-not (Select-String -Path src/config.rs -Pattern 'sound_volume' -Quiet)) { throw 'Persistent sound volume missing' }
          if (-not (Select-String -Path src/config.rs -Pattern 'DEFAULT_SOUND_VOLUME: u8 = 25' -Quiet)) { throw 'Default sound volume is not 25%' }
          if (-not (Select-String -Path src/runtime.rs -Pattern 'SetSoundVolume' -Quiet)) { throw 'Runtime sound volume command missing' }
          if (-not (Select-String -Path ui/app.slint -Pattern 'Sound volume' -Quiet)) { throw 'Advanced sound volume slider missing' }
          if (-not (Select-String -Path ui/app.slint -Pattern 'maximum: 100' -Quiet)) { throw 'Sound volume max is not 100%' }
          if (-not (Select-String -Path ui/app.slint -Pattern 'step: 5' -Quiet)) { throw 'Sound volume step is not 5%' }

      - name: Commit validated fix
        shell: pwsh
        run: |
          Remove-Item .github/workflows/sound-volume-slider-once.yml
          Remove-Item .github/workflows/sound-volume-slider-v2-once.yml
          Remove-Item .github/workflows/sound-volume-slider-v3-once.yml
          Remove-Item .github/workflows/sound-volume-slider-v4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audio): add persistent sound volume control"
          git push origin HEAD:dev/master
