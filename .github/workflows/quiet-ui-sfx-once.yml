name: One-shot quiet NumFlow UI SFX

on:
  push:
    branches:
      - dev/master
    paths:
      - .github/workflows/quiet-ui-sfx-once.yml

permissions:
  contents: write

jobs:
  quiet:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Lower UI SFX by 12 dB
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import audioop
          import wave

          gain = 0.25  # ~ -12 dB amplitude; keep semantic cues audible but unobtrusive.
          root = Path("assets/sfx/glass")
          files = sorted(root.glob("*.wav"))
          if not files:
              raise SystemExit("No UI SFX WAV files found")

          for path in files:
              with wave.open(str(path), "rb") as source:
                  params = source.getparams()
                  frames = source.readframes(source.getnframes())

              if params.sampwidth != 2:
                  raise SystemExit(f"Expected 16-bit PCM WAV: {path}")

              quieter = audioop.mul(frames, params.sampwidth, gain)
              with wave.open(str(path), "wb") as target:
                  target.setparams(params)
                  target.writeframes(quieter)

              before_peak = audioop.max(frames, params.sampwidth)
              after_peak = audioop.max(quieter, params.sampwidth)
              if before_peak and after_peak > int(before_peak * 0.26):
                  raise SystemExit(f"Gain verification failed for {path}: {before_peak} -> {after_peak}")
              print(f"{path.name}: peak {before_peak} -> {after_peak}")
          '@ | python -

      - name: Verify WAV assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem assets/sfx/glass/*.wav
          if ($files.Count -eq 0) { throw 'No UI SFX WAV files found' }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 44) { throw "Invalid WAV: $($file.Name)" }
            if ([Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'RIFF') { throw "Missing RIFF header: $($file.Name)" }
            if ([Text.Encoding]::ASCII.GetString($bytes, 8, 4) -ne 'WAVE') { throw "Missing WAVE header: $($file.Name)" }
          }

      - name: Commit quieter assets
        shell: pwsh
        run: |
          Remove-Item .github/workflows/quiet-ui-sfx-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/glass .github/workflows/quiet-ui-sfx-once.yml
          git commit -m "fix(audio): reduce UI sound volume"
          git push origin HEAD:dev/master
