name: One-shot Num Lock startup state repair

on:
  push:
    branches:
      - dev/master
    paths:
      - scripts/_startup_numlock_state_patch.py
      - .github/workflows/startup-numlock-state-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/master
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - name: Apply startup Num Lock state repair
        run: python scripts/_startup_numlock_state_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/_startup_numlock_state_patch.py .github/workflows/startup-numlock-state-once.yml
          git add crates/numflow-windows/src/hook.rs src/runtime.rs
          git commit -m "fix(input): reconcile Num Lock state from NumPad events"
          git push origin HEAD:dev/master
