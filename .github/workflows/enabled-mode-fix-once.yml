name: One-shot enabled mode repair

on:
  push:
    branches:
      - dev/master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enabled-mode-fix-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev/master
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply enabled mode repair
        run: python scripts/_enabled_mode_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release --all-features

      - name: Commit validated repair
        shell: pwsh
        run: |
          Remove-Item scripts/_enabled_mode_fix.py
          Remove-Item .github/workflows/enabled-mode-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(state): synchronize UI toggle with Num Lock runtime"
          git push origin HEAD:dev/master
