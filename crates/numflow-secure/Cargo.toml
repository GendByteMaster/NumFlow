[package]
name = "numflow-secure"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Minimal Windows secure-desktop runtime for NumFlow"
license = "MIT"
repository = "https://github.com/GendByteMaster/NumFlow"

[target.'cfg(windows)'.dependencies]
numflow-windows = { path = "../numflow-windows" }

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
