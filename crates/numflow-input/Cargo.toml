[package]
name = "numflow-input"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Minimal Windows UIAccess input helper for NumFlow"
license = "MIT"
repository = "https://github.com/GendByteMaster/NumFlow"
build = "../build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "numflow-input"
path = "src/main.rs"

[dependencies]
numflow-core = { path = "../numflow-core" }
numflow-windows = { path = "../numflow-windows" }
thiserror = "2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"