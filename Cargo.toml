[workspace]
members = ["crates/numflow-core", "crates/numflow-windows"]
resolver = "3"

[package]
name = "numflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Keyboard-driven pointer control built with Rust and Slint"
license = "MIT"
repository = "https://github.com/GendByteMaster/NumFlow"
build = "build.rs"

[dependencies]
atomicwrites = "0.4.4"
num-traits = "0.2"
numflow-core = { path = "crates/numflow-core" }
serde = { version = "1", features = ["derive"] }
slint = { version = "1.17.1", features = ["unstable-winit-030"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
crossbeam-channel = "0.5"
numflow-windows = { path = "crates/numflow-windows" }

[build-dependencies]
ico = "0.5"
resvg = "0.47"
slint-build = "1.17.1"
tiny-skia = { version = "0.12", features = ["png-format"] }
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
